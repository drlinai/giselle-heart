<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:sans-serif}

<canvas id="c"></canvas>
<script>
'use strict';
// ===== Web Audio chiptune engine (no external files) =====
const AudioSys = (() => {
  let ctx = null, master, bgmG, sfxG;
  let cur = null, timer = null, step = 0, nextT = 0, songName = null;
  const SEMI = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
  function freq(n){ const m=/^([A-G][#b]?)(\d)$/.exec(n); if(!m) return 0; return 440*Math.pow(2,(SEMI[m[1]]+(+m[2]-4)*12-9)/12); }
  function parse(str){ // "C5 E5:2 - G5" -> array per 8th step
    const out=[]; str.split(/\s+/).filter(Boolean).forEach(tok=>{ if(tok==='|') return; const [n,l]=tok.split(':'); const len=+(l||1); out.push(n==='-'?null:{f:freq(n),len}); for(let i=1;i<len;i++) out.push(undefined); }); return out; }
  function init(){ if(ctx) return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    master=ctx.createGain(); master.gain.value=0.55; master.connect(ctx.destination);
    bgmG=ctx.createGain(); bgmG.gain.value=0.28; bgmG.connect(master);
    sfxG=ctx.createGain(); sfxG.gain.value=0.5; sfxG.connect(master);
    if(songName) play(songName, true); }
  function resume(){ if(ctx && ctx.state==='suspended') ctx.resume(); }
  function osc(type,f,t0,dur,vol,dest,f2){ if(!ctx||f<=0) return; const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur); o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.03); }
  function noise(t0,dur,vol,dest,hp){ if(!ctx) return; const n=Math.floor(ctx.sampleRate*dur); const b=ctx.createBuffer(1,n,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const g=ctx.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur); let node=s; if(hp){ const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; s.connect(f); node=f; } node.connect(g); g.connect(dest); s.start(t0); }

  // ---------- SONGS (8th-note steps) ----------
  const SONGS = {
    title: { bpm:92, lead:'A4:2 C5:2 E5:2 A5:2 G5:4 E5:4 F5:2 E5:2 D5:2 C5:2 D5:4 E5:4 A4:2 C5:2 E5:2 A5:2 B5:4 G5:4 A5:2 G5:2 E5:2 C5:2 A4:8',
      bass:'A2:8 F2:8 D2:8 E2:8 A2:8 F2:8 D2:8 E2:8', drum:'k - - - s - h -', lt:'triangle' },
    taiwan: { bpm:150, lead:'E5 G5 C6 G5 E5 G5 A5 G5 F5 A5 C6 A5 F5 A5 G5 F5 E5 G5 C6 G5 E5 G5 A5 B5 C6:2 G5:2 E5:2 C5:2 D5 F5 A5 F5 D5 F5 G5 F5 E5 G5 C6 G5 E5 G5 A5 G5 F5 A5 C6 A5 G5 F5 E5 D5 C5:4 G5:2 C6:2',
      bass:'C3 - C3 G2 C3 - G2 - F2 - F2 C3 F2 - C3 - C3 - C3 G2 C3 - G2 - A2 - A2 E2 A2 - E2 - D2 - D2 A2 D2 - A2 - C3 - C3 G2 C3 - G2 - F2 - F2 C3 G2 - G2 - C3 - C3 - C3 - C3 -', drum:'k - h - s - h h', lt:'square' },
    singapore: { bpm:138, lead:'F5 - A5 C6 - A5 F5 - G5 - Bb5 D6 - Bb5 G5 - A5 - C6 E6 - C6 A5 - F6:2 E6:2 C6:2 A5:2 F5 - A5 C6 - A5 F5 - G5 - Bb5 D6 - Bb5 G5 - A5 C6 F6 E6 D6 C6 A5 G5 F5:4 -:2 C6:2',
      bass:'F2 - F2 - C3 - F2 - G2 - G2 - D3 - G2 - A2 - A2 - E3 - A2 - F2 - C3 - F2 - C3 - F2 - F2 - C3 - F2 - G2 - G2 - D3 - G2 - A2 - A2 - E3 - A2 - F2 - C3 - F2 - F2 -', drum:'k - h k - k h -', lt:'square' },
    moon: { bpm:104, lead:'D5:3 A5:1 F5:2 D5:2 E5:3 G5:1 E5:2 C5:2 D5:3 A5:1 F5:2 A5:2 Bb5:4 A5:4 D5:3 A5:1 F5:2 D5:2 E5:3 G5:1 E5:2 C5:2 F5:2 G5:2 A5:2 C6:2 D6:8',
      bass:'D2:4 A2:4 C3:4 G2:4 D2:4 A2:4 Bb2:4 A2:4 D2:4 A2:4 C3:4 G2:4 F2:4 G2:4 D3:8', drum:'k - - - s - - h', lt:'triangle' },
    boss: { bpm:172, lead:'E4 B4 E5 B4 E4 B4 E5 G5 C5 G5 C6 G5 C5 G5 C6 D6 E5 B4 E5 B4 G5 F#5 E5 D5 B4 D5 F#5 B5 A5 F#5 D5 B4 E4 B4 E5 B4 E4 B4 E5 G5 C5 G5 C6 G5 C5 G5 C6 D6 E5 G5 B5 E6 D6 B5 G5 E5 F#5 D5 B4 F#4 B4:2 E5:2',
      bass:'E2 E2 E3 E2 E2 E2 E3 E2 C2 C2 C3 C2 C2 C2 C3 C2 E2 E2 E3 E2 E2 E2 E3 E2 B1 B1 B2 B1 B1 B1 B2 B1 E2 E2 E3 E2 E2 E2 E3 E2 C2 C2 C3 C2 C2 C2 C3 C2 E2 E2 E3 E2 G2 G2 G3 G2 B1 B1 B2 B1 B1 B1 B2 B1', drum:'k h s h k k s h', lt:'sawtooth' },
    reunion: { bpm:88, lead:'G4:2 B4:2 D5:4 B4:2 D5:2 G5:4 F#5:2 E5:2 D5:2 B4:2 A4:8 G4:2 B4:2 D5:4 E5:2 D5:2 B4:4 C5:2 B4:2 A4:2 B4:2 G4:8',
      bass:'G2:8 D2:8 E2:8 D2:8 G2:8 C3:8 D2:8 G2:8', drum:'- - - - - - - -', lt:'triangle' },
    birthday: { bpm:120, lead:'G4 G4 A4:2 G4:2 C5:2 B4:4 G4 G4 A4:2 G4:2 D5:2 C5:4 G4 G4 G5:2 E5:2 C5:2 B4:2 A4:2 F5 F5 E5:2 C5:2 D5:2 C5:4',
      bass:'C3:6 C3:6 G2:6 C3:6 C3:6 F2:6 G2:6 C3:6', drum:'- - - - - -', lt:'triangle' },
    eerie: { bpm:60, lead:'- - - - - - - - E4:4 - - - - Eb4:4 - - - - - - - -', bass:'A1:8 - - - - - - -', drum:'- - - - - - - -', lt:'sine' },
  };
  function play(name, force){ if(!force && songName===name) return; songName=name; stop(true); if(!ctx) return; cur={ name, lead:parse(SONGS[name].lead), bass:parse(SONGS[name].bass), drum:SONGS[name].drum.split(/\s+/).filter(Boolean), bpm:SONGS[name].bpm, lt:SONGS[name].lt||'square' }; step=0; nextT=ctx.currentTime+0.05; timer=setInterval(tick,30); }
  function stop(keepName){ if(timer) clearInterval(timer); timer=null; cur=null; if(!keepName) songName=null; }
  function tick(){ if(!cur||!ctx) return; const spb=60/cur.bpm/2; while(nextT<ctx.currentTime+0.15){ const t=nextT; const L=cur.lead[step%cur.lead.length], B=cur.bass[step%cur.bass.length], D=cur.drum[step%cur.drum.length];
      if(L) osc(cur.lt,L.f,t,spb*L.len*0.9,0.18,bgmG);
      if(B) osc('triangle',B.f,t,spb*B.len*0.95,0.22,bgmG);
      if(D==='k') osc('sine',120,t,0.12,0.5,bgmG,40); else if(D==='s') noise(t,0.1,0.25,bgmG,1200); else if(D==='h') noise(t,0.03,0.08,bgmG,6000);
      nextT+=spb; step++; } }

  // ---------- SFX ----------
  const SFX = {
    jump(){ osc('square',300,ctx.currentTime,0.12,0.25,sfxG,700); },
    djump(){ osc('square',500,ctx.currentTime,0.12,0.25,sfxG,1100); },
    attack(){ noise(ctx.currentTime,0.08,0.3,sfxG,2500); osc('square',900,ctx.currentTime,0.06,0.15,sfxG,300); },
    hit(){ osc('square',200,ctx.currentTime,0.08,0.3,sfxG,80); noise(ctx.currentTime,0.06,0.2,sfxG,800); },
    hurt(){ osc('sawtooth',250,ctx.currentTime,0.25,0.35,sfxG,60); },
    die(){ for(let i=0;i<4;i++) osc('square',400-i*80,ctx.currentTime+i*0.12,0.14,0.3,sfxG,100); },
    enemyDie(){ noise(ctx.currentTime,0.2,0.3,sfxG,400); osc('square',150,ctx.currentTime,0.2,0.2,sfxG,40); },
    dash(){ osc('sine',1200,ctx.currentTime,0.15,0.2,sfxG,200); noise(ctx.currentTime,0.1,0.1,sfxG,3000); },
    ult(){ const t=ctx.currentTime; for(let i=0;i<8;i++) osc('square',220*(1+i*0.25),t+i*0.05,0.4,0.2,sfxG); noise(t,0.6,0.3,sfxG,500); },
    pickup(){ osc('square',880,ctx.currentTime,0.08,0.2,sfxG); osc('square',1320,ctx.currentTime+0.08,0.12,0.2,sfxG); },
    select(){ osc('square',660,ctx.currentTime,0.06,0.2,sfxG); osc('square',990,ctx.currentTime+0.06,0.1,0.2,sfxG); },
    move(){ osc('square',500,ctx.currentTime,0.04,0.15,sfxG); },
    blip(){ osc('square',1000,ctx.currentTime,0.02,0.05,sfxG); },
    teleport(){ const t=ctx.currentTime; for(let i=0;i<12;i++) osc('sine',300+i*120,t+i*0.04,0.3,0.15,sfxG,300+i*240); noise(t+0.4,0.5,0.25,sfxG,2000); },
    bossHit(){ osc('square',120,ctx.currentTime,0.1,0.3,sfxG,60); noise(ctx.currentTime,0.08,0.2,sfxG,1000); },
    bossDie(){ const t=ctx.currentTime; for(let i=0;i<10;i++){ noise(t+i*0.12,0.3,0.35,sfxG,200+i*100); osc('sawtooth',100-i*5,t+i*0.12,0.3,0.25,sfxG,30);} },
    shoot(){ osc('square',700,ctx.currentTime,0.1,0.15,sfxG,200); },
    stomp(){ osc('sine',80,ctx.currentTime,0.3,0.5,sfxG,30); noise(ctx.currentTime,0.2,0.3,sfxG,300); },
    shatter(){ const t=ctx.currentTime; for(let i=0;i<6;i++) osc('triangle',1500+Math.random()*1500,t+i*0.05,0.3,0.2,sfxG,400); noise(t,0.3,0.3,sfxG,3000); },
    heart(){ const t=ctx.currentTime; [523,659,784,1047].forEach((f,i)=>osc('sine',f,t+i*0.1,0.5,0.2,sfxG)); },
    alarm(){ osc('square',440,ctx.currentTime,0.3,0.2,sfxG,445); },
  };
  function sfx(n){ if(!ctx) return; try{ SFX[n] && SFX[n](); }catch(e){} }
  return { init, resume, play, stop, sfx, get ready(){ return !!ctx; } };
})();

</script>
<script>
'use strict';
// ===== Core engine: canvas, input, drawing, text, dialog, fade, particles, cutscene =====
const W=480, H=272, TILE=16, ROWS=17;
const FONT='"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif';
const FONT_EN='Georgia,"Times New Roman",serif';
const canvas=document.getElementById('c');
let ctx=canvas.getContext('2d');
let SCALE=2;
function resize(){
  const s=Math.max(1, Math.floor(Math.min(window.innerWidth/W, window.innerHeight/H)*2)/2);
  SCALE=s; const dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=Math.round(W*s*dpr); canvas.height=Math.round(H*s*dpr);
  canvas.style.width=(W*s)+'px'; canvas.style.height=(H*s)+'px';
}
window.addEventListener('resize',resize); resize();
function beginFrame(){ const dpr=Math.min(2, window.devicePixelRatio||1); ctx.setTransform(SCALE*dpr,0,0,SCALE*dpr,0,0); ctx.imageSmoothingEnabled=false; }

// ---- input ----
const Keys={}, Pressed={};
const PREVENT=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
window.addEventListener('keydown',e=>{ AudioSys.init(); AudioSys.resume(); if(!Keys[e.code]) Pressed[e.code]=true; Keys[e.code]=true; if(PREVENT.has(e.code)) e.preventDefault(); });
window.addEventListener('keyup',e=>{ Keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in Keys) Keys[k]=false; });
const key=c=>!!Keys[c], pressed=c=>!!Pressed[c];
function clearPressed(){ for(const k in Pressed) Pressed[k]=false; }
const CONFIRM=()=>pressed('Space')||pressed('Enter')||pressed('KeyA');

// ---- drawing helpers ----
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function RA(x,y,w,h,c,a){ ctx.globalAlpha=a; R(x,y,w,h,c); ctx.globalAlpha=1; }
function circ(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function heartShape(x,y,s,c){ // pixel heart, s = half width
  ctx.fillStyle=c; const u=Math.max(1,s/3);
  R(x-s,y-u,u*2,u*2); R(x,y-u,u*2,u*2); R(x-s-u/2,y,s*2+u,u*2); R(x-s+u/2,y+u*2,s*2-u,u); R(x-s+u*1.5,y+u*3,s*2-u*3,u); R(x-u/2,y+u*4,u,u);
}
function star(x,y,r,c,a){ ctx.fillStyle=c; ctx.globalAlpha=a==null?1:a; ctx.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r*0.4:r; const an=-Math.PI/2+i*Math.PI/5; ctx.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr);} ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
function sparkle(x,y,s,c){ R(x-s,y,s*2+1,1,c); R(x,y-s,1,s*2+1,c); }
let seedv=1; function srand(seed){ seedv=seed; } function rnd(){ seedv=(seedv*16807)%2147483647; return (seedv-1)/2147483646; }
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

// ---- text ----
function text(s,x,y,o={}){
  ctx.font=`${o.bold?'bold ':''}${o.size||9}px ${o.font||FONT}`; ctx.textAlign=o.align||'left'; ctx.textBaseline='top';
  if(o.shadow!==false){ ctx.fillStyle=o.shadow||'#000'; ctx.fillText(s,x+1,y+1); }
  ctx.fillStyle=o.color||'#fff'; ctx.fillText(s,x,y);
}
function textW(s,size,font,bold){ ctx.font=`${bold?'bold ':''}${size||9}px ${font||FONT}`; return ctx.measureText(s).width; }
function wrap(s,maxW,size){ const lines=[]; let cur=''; for(const ch of s){ if(ch==='\n'){ lines.push(cur); cur=''; continue; } if(textW(cur+ch,size)>maxW){ lines.push(cur); cur=ch; } else cur+=ch; } lines.push(cur); return lines; }

// ---- fade ----
const Fade={ a:0, target:0, speed:0.03, cb:null,
  to(t,speed,cb){ this.target=t; this.speed=speed||0.03; this.cb=cb||null; },
  set(a){ this.a=a; this.target=a; },
  update(){ if(this.a!==this.target){ this.a=this.a<this.target?Math.min(this.target,this.a+this.speed):Math.max(this.target,this.a-this.speed); if(this.a===this.target&&this.cb){ const c=this.cb; this.cb=null; c(); } } },
  draw(){ if(this.a>0){ ctx.globalAlpha=this.a; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; } }
};

// ---- particles ----
const Particles={ list:[],
  add(p){ this.list.push(Object.assign({vx:0,vy:0,life:30,g:0,size:1,color:'#fff',type:'rect',fade:true},p)); },
  burst(x,y,n,color,spd,life,g){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*spd; this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life||30,color:Array.isArray(color)?color[i%color.length]:color,size:1+Math.random()*2,g:g||0}); } },
  hearts(x,y,n){ for(let i=0;i<n;i++) this.add({x:x+rand(-10,10),y:y+rand(-6,6),vx:rand(-0.3,0.3),vy:rand(-1.2,-0.4),life:rand(40,80),color:['#ff6b9d','#ff9ec4','#ffd1e1'][i%3],size:rand(2,4),type:'heart'}); },
  update(){ for(let i=this.list.length-1;i>=0;i--){ const p=this.list[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; if(p.life<=0) this.list.splice(i,1); } },
  draw(){ for(const p of this.list){ ctx.globalAlpha=p.fade?clamp(p.life/20,0,1):1; if(p.type==='heart') heartShape(p.x,p.y,p.size,p.color); else if(p.type==='spark') sparkle(p.x,p.y,p.size,p.color); else R(p.x,p.y,p.size,p.size,p.color); } ctx.globalAlpha=1; },
  clear(){ this.list.length=0; }
};

// ---- dialog ----
const Dialog={ lines:[], i:0, shown:0, active:false, cb:null, speed:0.6, top:false,
  start(lines,cb){ this.lines=lines.map(l=>typeof l==='string'?{who:'',text:l}:l); this.i=0; this.shown=0; this.active=true; this.cb=cb||null; },
  update(){ if(!this.active) return; const L=this.lines[this.i]; const full=this.shown>=L.text.length;
    if(!full){ const prev=Math.floor(this.shown); this.shown=Math.min(L.text.length,this.shown+this.speed); if(Math.floor(this.shown)!==prev && Math.floor(this.shown)%2===0) AudioSys.sfx('blip'); }
    if(CONFIRM()){ if(!full){ this.shown=L.text.length; } else { this.i++; this.shown=0; AudioSys.sfx('move'); if(this.i>=this.lines.length){ this.active=false; const c=this.cb; this.cb=null; if(c) c(); } } }
  },
  draw(){ if(!this.active) return; const L=this.lines[this.i]; const bx=16,by=this.top?10:H-70,bw=W-32,bh=58;
    RA(bx,by,bw,bh,'#0a0a1e',0.88); R(bx,by,bw,1,'#8fb4ff'); R(bx,by+bh-1,bw,1,'#8fb4ff'); R(bx,by,1,bh,'#8fb4ff'); R(bx+bw-1,by,1,bh,'#8fb4ff');
    let ty=by+8; if(L.who){ text(L.who,bx+10,by+6,{size:9,color:L.color||'#ffd27f',bold:true}); ty=by+20; }
    const s=L.text.slice(0,Math.floor(this.shown)); const lines=wrap(s,bw-24,9); lines.forEach((ln,k)=>text(ln,bx+12,ty+k*13,{size:9}));
    if(this.shown>=L.text.length && (G.frame>>4)&1) text('▼',bx+bw-16,by+bh-14,{size:8,color:'#8fb4ff'});
  }
};

// ---- cutscene ----
class Cutscene{
  constructor(steps){ this.steps=steps; this.i=-1; this.t=0; this.done=false; this.next(); }
  next(){ this.i++; this.t=0; const s=this.steps[this.i]; if(!s){ this.done=true; return; } if(s.enter) s.enter(); if(s.dialog){ const d=typeof s.dialog==='function'?s.dialog():s.dialog; Dialog.start(d,()=>this.next()); } else if(s.dur===0) this.next(); }
  update(){ if(this.done) return; const s=this.steps[this.i]; this.t++; if(s.update) s.update(this.t);
    if(Dialog.active){ Dialog.update(); return; }
    if(s.dialog) return; // waiting for dialog callback
    if(s.wait){ if(CONFIRM()) this.next(); return; }
    if(s.dur!=null && this.t>=s.dur) this.next(); }
  draw(){ const s=this.steps[Math.min(this.i,this.steps.length-1)]; if(s&&s.draw) s.draw(this.t); if(Dialog.active) Dialog.draw(); }
}

</script>
<script>
'use strict';
// ===== Characters & enemy sprites (procedural pixel drawing) =====
const CHARS = {
  giselle:{ headW:8, headH:8, bodyW:8, bodyH:8, legH:9, skin:'#ffdcc2', hair:'#3d8bff', hair2:'#a9dcff', hairStyle:'long', top:'#ffffff', topAcc:'#ff7fb0', bottom:'#ff7fb0', skirt:true, shoe:'#d43f78', sparkle:true, eye:'#2a4a9a', name:'Giselle' },
  william:{ headW:8, headH:8, bodyW:10, bodyH:10, legH:10, skin:'#f2c9a6', hair:'#2a1a10', hairStyle:'short', top:'#1f2f6b', collar:'#3a4f9a', bottom:'#182452', shoe:'#111', eye:'#222', name:'William' },
  liam:{ headW:7, headH:7, bodyW:7, bodyH:6, legH:7, skin:'#f7d2b2', hair:'#5a3a20', hairStyle:'short', top:'#2e9e4f', collar:'#1e7a3a', bottom:'#3b6fb0', shoe:'#333', eye:'#222', name:'Liam' },
  rex:{ headW:8, headH:7, bodyW:6, bodyH:4, legH:3, skin:'#fbdcc4', hair:'#6b4a2a', hairStyle:'baby', top:null, bottom:'#ffffff', diaper:true, shoe:null, eye:'#222', name:'Rex' },
};
// o: {face, walk(phase), jump, attack(0..1), t, flash, arms:'up'|'hug', lie, sit, alpha, happy}
function drawChar(name,x,y,o={}){
  const s=CHARS[name], t=o.t||0, face=o.face||1;
  const C=c=>o.flash?'#ffffff':c;

<script>
'use strict';
// ===== Player, enemies, bosses, projectiles =====
const sfx=n=>AudioSys.sfx(n);
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const SOLID=v=>v===1;

class Player{
  constructor(x,y){ this.x=x; this.y=y; this.vx=0; this.vy=0; this.w=10; this.h=24; this.face=1; this.onGround=false; this.jumps=0; this.maxHp=8; this.hp=8; this.energy=0; this.inv=0; this.attackT=0; this.attackHit=new Set(); this.dashT=0; this.dashCd=0; this.walk=0; this.t=0; this.dead=false; this.after=[]; this.ultT=0; this.hurtT=0; this.locked=false; this.dropping=0; this.deathT=0; }
  rect(){ return {x:this.x-this.w/2,y:this.y-this.h,w:this.w,h:this.h}; }
  slashRect(){ return {x:this.face>0?this.x+1:this.x-25,y:this.y-30,w:24,h:30}; }
  update(level){
    this.t++; if(this.inv>0) this.inv--; if(this.dashCd>0) this.dashCd--; if(this.hurtT>0) this.hurtT--; if(this.ultT>0) this.ultT--; if(this.dropping>0) this.dropping--; if(this.attackT>0) this.attackT--;
    if(this.dead){ this.deathT++; this.vy+=0.2; this.y+=this.vy; return; }
    const g=THEMES[level.theme].gravity;
    if(this.dashT>0){ this.dashT--; this.vx=this.face*5; this.vy=0; if(this.dashT%2===0) this.after.push({x:this.x,y:this.y,face:this.face,life:12}); }
    else {
      let ax=0; if(!this.locked && this.hurtT===0){ if(key('ArrowLeft')) ax=-1; if(key('ArrowRight')) ax=1; }
      const sp=1.7; if(ax){ this.vx=lerp(this.vx,ax*sp,0.3); this.face=ax; this.walk+=0.22; } else { this.vx=lerp(this.vx,0,0.35); if(Math.abs(this.vx)<0.05) this.vx=0; }
      if(!this.locked && pressed('Space')){
        if(this.onGround && key('ArrowDown') && this.onPlatform){ this.dropping=8; this.y+=1; this.onGround=false; }
        else if(this.onGround){ this.vy=-4.8; this.jumps=1; this.onGround=false; sfx('jump'); }
        else if(this.jumps<2){ this.vy=-4.5; this.jumps=2; sfx('djump'); Particles.burst(this.x,this.y,8,'#a9dcff',1.3,16); Particles.add({x:this.x,y:this.y,type:'heart',color:'#ff9ec4',size:3,vy:-0.5,life:20}); }
      }
      if(!key('Space') && this.vy<-1.6) this.vy=-1.6;
      this.vy+=g; if(this.vy>6) this.vy=6;
      if(!this.locked && pressed('KeyS') && this.dashCd===0){ this.dashT=10; this.dashCd=42; this.inv=Math.max(this.inv,14); sfx('dash'); }
      if(!this.locked && pressed('KeyA') && this.attackT===0){ this.attackT=14; sfx('attack'); G.pproj.push({x:this.x+this.face*6,y:this.y-14,vx:this.face*4.6,life:42,t:0}); Particles.burst(this.x+this.face*8,this.y-14,4,'#ff9ec4',1,10); }
      if(!this.locked && pressed('KeyD') && this.energy>=100){ this.energy=0; this.ultT=45; sfx('ult'); G.ult(); }
    }
    this.moveX(level); this.moveY(level);
    for(const a of this.after) a.life--; this.after=this.after.filter(a=>a.life>0);
  }
  moveX(level){ this.x+=this.vx; const r=this.rect(); const ty0=Math.floor(r.y/TILE), ty1=Math.floor((r.y+r.h-1)/TILE);
    if(this.vx>0){ const tx=Math.floor((r.x+r.w)/TILE); for(let ty=ty0;ty<=ty1;ty++) if(SOLID(level.get(tx,ty))){ this.x=tx*TILE-this.w/2-0.01; this.vx=0; this.dashT=0; break; } }
    else if(this.vx<0){ const tx=Math.floor(r.x/TILE); for(let ty=ty0;ty<=ty1;ty++) if(SOLID(level.get(tx,ty))){ this.x=(tx+1)*TILE+this.w/2+0.01; this.vx=0; this.dashT=0; break; } }
    if(this.x<this.w/2) this.x=this.w/2; if(this.x>level.w*TILE-this.w/2) this.x=level.w*TILE-this.w/2; }
  moveY(level){ const prev=this.y; this.y+=this.vy; const r=this.rect(); const tx0=Math.floor(r.x/TILE), tx1=Math.floor((r.x+r.w-1)/TILE); this.onGround=false; this.onPlatform=false;
    if(this.vy>=0){ const ty=Math.floor(this.y/TILE); for(let tx=tx0;tx<=tx1;tx++){ const v=level.get(tx,ty); if(SOLID(v) || (v===2 && prev<=ty*TILE+0.01 && this.dropping===0)){ this.y=ty*TILE; this.vy=0; this.onGround=true; this.onPlatform=(v===2); this.jumps=0; break; } } }
    else { const ty=Math.floor((this.y-this.h)/TILE); for(let tx=tx0;tx<=tx1;tx++) if(SOLID(level.get(tx,ty))){ this.y=(ty+1)*TILE+this.h; this.vy=0; break; } } }
  hurt(d,fromX){ if(this.dead||this.inv>0||this.dashT>0) return false; this.hp-=d; this.inv=75; this.hurtT=16; this.vx=(this.x<fromX?-2.6:2.6); this.vy=-2.6; this.attackT=0; sfx('hurt'); Particles.burst(this.x,this.y-12,8,'#ff6b9d',1.5,20); if(this.hp<=0){ this.hp=0; this.die(); } return true; }
  die(){ if(this.dead) return; this.dead=true; this.deathT=0; this.vy=-4; this.vx=0; sfx('die'); Particles.burst(this.x,this.y-12,20,['#fff','#a9dcff','#ff9ec4'],2.5,40); }
  draw(){
    for(const a of this.after){ drawChar('giselle',a.x,a.y,{face:a.face,t:this.t,alpha:a.life/24,jump:true}); }
    if(this.inv>0 && !this.dead && (this.inv>>2)&1) return;
    const o={face:this.face,t:this.t,flash:this.hurtT>10};
    if(this.dead){ o.lie=true; o.sleep=true; }
    else if(this.attackT>0){ o.attack=1-this.attackT/14; if(!this.onGround) o.jump=true; }
    else if(this.dashT>0){ o.jump=true; }
    else if(!this.onGround){ o.jump=true; }
    else if(Math.abs(this.vx)>0.2){ o.walk=this.walk; }
    drawChar('giselle',this.x,this.y,o);
    if(this.ultT>0){ const p=1-this.ultT/45; ctx.globalAlpha=1-p; ctx.strokeStyle='#ff6b9d'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(this.x,this.y-12,p*260,0,Math.PI*2); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(this.x,this.y-12,p*200,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; heartShape(this.x,this.y-50-p*30,6+p*10,'#ff6b9d'); }
  }
}

class Enemy{
  constructor(s,theme){ this.kind=s.kind; this.theme=theme; this.x=s.x; this.y=s.y; this.y0=s.y; this.face=-1; this.t=Math.floor(Math.random()*100); this.flash=0; this.dead=false; this.cd=60+Math.random()*60;
    this.hp={walker:3,flyer:2,shooter:4}[this.kind]; this.w=14; this.h={walker:14,flyer:16,shooter:18}[this.kind]; }
  rect(){ return {x:this.x-this.w/2,y:this.y-this.h,w:this.w,h:this.h}; }
  update(level,pl){ this.t++; if(this.flash>0) this.flash--;
    if(this.kind==='walker'){ const sp=0.55; this.x+=this.face*sp; const ahead=Math.floor((this.x+this.face*9)/TILE), row=Math.floor(this.y/TILE); const g=level.get(ahead,row), up=level.get(ahead,row-1); if(SOLID(up) || !(g===1||g===2)){ this.face*=-1; this.x+=this.face*2; } }
    else if(this.kind==='flyer'){ const d=pl.x-this.x; const near=Math.abs(d)<130 && !pl.dead; if(near){ this.x+=Math.sign(d)*0.55; this.y0+=clamp((pl.y-18)-this.y0,-0.35,0.35); this.face=d<0?-1:1; } else { this.x+=Math.sin(this.t/50)*0.6; } this.y=this.y0+Math.sin(this.t/14)*7; }

// ---------------- BOSSES ----------------
class Boss{
  constructor(level){ this.level=level; this.theme=level.theme; this.ax=level.bossX; this.x=this.ax+W-110; this.gy=(ROWS-3)*TILE; this.y=this.gy; this.face=-1; this.t=0; this.flash=0; this.state='intro'; this.st=0; this.dead=false; this.hp=this.maxHp; this.vx=0; this.vy=0; this.phase=1; this.alpha=1; this.shake=0; }
  rect(){ return {x:this.x-this.w/2,y:this.y-this.h,w:this.w,h:this.h}; }
  hurt(d){ if(this.dead||this.state==='intro'||this.alpha<0.5) return false; this.hp-=d; this.flash=5; sfx('bossHit'); Particles.burst(this.x,this.y-this.h/2,8,'#fff',2,20); if(this.hp<=this.maxHp*0.5 && this.phase===1){ this.phase=2; this.onPhase2&&this.onPhase2(); } if(this.hp<=0){ this.hp=0; this.dead=true; this.state='dying'; this.st=0; this.alpha=1; sfx('bossDie'); G.shake=30; } return true; }
  setState(s){ this.state=s; this.st=0; }
  faceP(pl){ this.face=pl.x<this.x?-1:1; }
  update(pl){ this.t++; this.st++; if(this.flash>0) this.flash--;
    if(this.state==='dying'){ if(this.st%5===0) Particles.burst(this.x+rand(-this.w/2,this.w/2),this.y-rand(0,this.h),12,['#fff','#ffd27f','#ff6b9d'],2.5,28); this.alpha=Math.max(0,1-this.st/110); return; }
    if(this.state==='intro'){ if(this.st>80) this.setState('idle'); return; }
    this.think(pl); this.x=clamp(this.x,this.ax+this.w/2+4,this.ax+W-this.w/2-4); }
  wave(dir,sp){ G.proj.push({kind:'wave',x:this.x+dir*(this.w/2),y:this.gy,vx:dir*(sp||2.4),vy:0,g:0,r:5,life:200,ground:true}); }
  dmgTint(){ return this.flash>0; }
}

// ---------------- projectiles / pickups ----------------
function updateProjectiles(level,pl){
  const P=G.proj;
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.life--; let kill=p.life<=0;
    if(p.kind==='laser'){ /* static */ }
    else { p.x+=p.vx; p.y+=p.vy; p.vy+=p.g;
      if(p.ground){ const below=level.get(Math.floor(p.x/TILE),Math.floor((p.y+1)/TILE)); const ahead=level.get(Math.floor((p.x+Math.sign(p.vx)*6)/TILE),Math.floor((p.y-4)/TILE)); if(!SOLID(below)||SOLID(ahead)) kill=true; if(p.life%3===0) Particles.add({x:p.x,y:p.y-2,vy:-0.8,vx:rand(-0.5,0.5),life:12,color:'#ffd27f',size:2}); }
      else { const v=level.get(Math.floor(p.x/TILE),Math.floor(p.y/TILE)); if(SOLID(v)) kill=true; }
      if(p.y>H+40||p.x<G.cam.x-60||p.x>G.cam.x+W+60) kill=true; }
    if(kill){ if(p.kind!=='laser') Particles.burst(p.x,p.y,5,'#fff',1,10); P.splice(i,1); continue; }
    // hit player
    if(!pl.dead){ const r=pl.rect(); let hit=false;
      if(p.kind==='laser'){ hit=r.y<p.y+3&&r.y+r.h>p.y-1&&r.x<p.x0+p.len&&r.x+r.w>p.x0; }
      else { const cx=clamp(p.x,r.x,r.x+r.w), cy=clamp(p.y,r.y,r.y+r.h); hit=(p.x-cx)**2+(p.y-cy)**2<=(p.r+1)**2; }
      if(hit && pl.hurt(1,p.x)){ if(p.kind!=='laser'){ Particles.burst(p.x,p.y,6,'#fff',1.5,12); P.splice(i,1); } } }
  }
}
function updatePickups(level,pl){ const L=G.pickups; for(let i=L.length-1;i>=0;i--){ const p=L[i]; p.t=(p.t||0)+1; if(p.vy!=null){ p.vy+=0.2; p.y+=p.vy; const v=level.get(Math.floor(p.x/TILE),Math.floor(p.y/TILE)); if(v===1||v===2){ p.y=Math.floor(p.y/TILE)*TILE; p.vy=null; } if(p.y>H+40){ L.splice(i,1); continue; } }
    if(!pl.dead && overlap({x:p.x-5,y:p.y-12,w:10,h:12},pl.rect())){ pl.hp=Math.min(pl.maxHp,pl.hp+2); sfx('pickup'); Particles.hearts(pl.x,pl.y-16,5); L.splice(i,1); } } }

function drawHeartShot(p){ const s=3+Math.sin(p.t/2)*0.5; heartShape(p.x,p.y-2,s,'#ff4d79'); heartShape(p.x,p.y-2,1.5,'#fff'); }
function updatePlayerShots(level,pl){ const P=G.pproj; for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.t++; p.x+=p.vx; p.life--;
    if(p.life%2===0) Particles.add({x:p.x-Math.sign(p.vx)*3,y:p.y-2+rand(-2,2),vx:-p.vx*0.1,vy:rand(-0.3,0.3),life:10,color:'#ff9ec4',size:1.5,type:'spark'});
    let kill=p.life<=0 || SOLID(level.get(Math.floor(p.x/TILE),Math.floor(p.y/TILE)));
    const r={x:p.x-5,y:p.y-7,w:10,h:10};
    if(!kill){ for(const e of G.enemies){ if(!e.dead && overlap(r,e.rect())){ e.hurt(2); pl.energy=Math.min(100,pl.energy+14); if(pl.energy===100) sfx('select'); kill=true; break; } } }
    if(!kill && G.boss && !G.boss.dead && G.boss.alpha>0.5 && G.boss.state!=='intro' && overlap(r,G.boss.rect())){ if(G.boss.hurt(2)){ pl.energy=Math.min(100,pl.energy+9); } kill=true; }
    if(kill){ Particles.burst(p.x,p.y,6,['#ff6b9d','#fff'],1.5,12); P.splice(i,1); } } }

    { dialog:[ {who:'William',text:'……我的超能力？',color:'#9fa8da'} ], draw:morning },
    { dur:60, enter:()=>{ Fade.to(1,0.03); AudioSys.stop(); }, draw:morning },
    { dur:200, enter:()=>Fade.set(0), draw:t=>{ R(0,0,W,H,'#000'); ctx.globalAlpha=clamp(t/40,0,1); text('全劇終',W/2,100,{size:22,align:'center',color:'#fff',bold:true}); text('THE END',W/2,132,{size:12,align:'center',color:'#aaa',font:FONT_EN}); if(t>100){ ctx.globalAlpha=clamp((t-100)/40,0,1); text("Giselle's Heart II",W/2,180,{size:11,align:'center',color:'#ff9ec4',font:FONT_EN}); text('To be continued……?',W/2,196,{size:9,align:'center',color:'#888',font:FONT_EN}); } ctx.globalAlpha=1; } },
    { wait:true, draw:t=>{ R(0,0,W,H,'#000'); text('全劇終',W/2,100,{size:22,align:'center',color:'#fff',bold:true}); text('THE END',W/2,132,{size:12,align:'center',color:'#aaa',font:FONT_EN}); text("Giselle's Heart II",W/2,180,{size:11,align:'center',color:'#ff9ec4',font:FONT_EN}); text('To be continued……?',W/2,196,{size:9,align:'center',color:'#888',font:FONT_EN}); if((t>>4)&1) text('▼ 空白鍵',W/2,240,{size:8,align:'center',color:'#666'}); } },
    { dur:1, update:()=>onDone() },
  ]);
};

// ---------- BIRTHDAY CARD ----------
const BIRTHDAY_LINES=[
  '2026 . 11 . 25',
  '親愛的 Giselle：',
  '在這個世界上，妳一直是那個救我們的人。',
  '謝謝妳用妳的超能力——愛、耐心和笑容——',
  '守護著這個家，守護著吉賽兒之心。',
  '老婆，生日快樂。',
  '我愛妳。',
  '— William、Liam、Rex',
];
Scenes.birthday=function(onDone){ AudioSys.play('birthday'); srand(7); const confetti=[]; for(let i=0;i<40;i++) confetti.push({x:rnd()*W,y:rnd()*H,s:rnd()*2+1,c:['#ff6b9d','#ffd27f','#a9dcff','#fff','#b388ff'][i%5],v:rnd()*0.5+0.3});
  const draw=t=>{ const gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2a0a3a'); gr.addColorStop(1,'#7a1f5a'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    confetti.forEach(c=>{ c.y+=c.v; if(c.y>H) c.y=-4; R(c.x+Math.sin(t/20+c.y/30)*4,c.y,c.s,c.s,c.c); });
    if(t%10===0) Particles.add({x:rand(0,W),y:H+4,vy:rand(-1,-0.4),vx:rand(-0.2,0.2),life:120,type:'heart',size:rand(2,5),color:['#ff6b9d','#ff9ec4','#ffd1e1'][t%3]});
    const cw=330,ch=200,cx=(W-cw)/2,cy=30; RA(cx,cy,cw,ch,'#fff',0.93); R(cx,cy,cw,3,'#ff6b9d'); R(cx,cy+ch-3,cw,3,'#ff6b9d'); heartShape(cx+cw/2,cy+12,8,'#ff4d79'); heartShape(cx+16,cy+16,4,'#ff9ec4'); heartShape(cx+cw-16,cy+16,4,'#ff9ec4');
    let y=cy+32; const shown=Math.floor(t/18); BIRTHDAY_LINES.forEach((l,i)=>{ const big=i===5||i===6; if(i<=shown){ const a=clamp((t-i*18)/18,0,1); ctx.globalAlpha=a; text(l,cx+cw/2,y,{size:big?13:(i===0?10:9),align:'center',color:i===0?'#7a1f5a':big?'#d81b60':'#3e2723',bold:big,shadow:false,font:i===0?FONT_EN:FONT}); ctx.globalAlpha=1; } y+=big?20:17; });
    // family at bottom
    const by=262; drawChar('liam',cx+60,by,{t,face:1,arms:'up',happy:true}); drawChar('giselle',cx+120,by,{t,face:1,happy:true}); drawChar('rex',cx+150,by,{t,face:-1,arms:'up',happy:true}); drawChar('william',cx+185,by,{t,face:-1,happy:true}); if(t%40===0) Particles.hearts(cx+120,by-30,3);
    if(t>BIRTHDAY_LINES.length*18+60 && (t>>4)&1) text('♥ 空白鍵 回到標題 ♥',W/2,H-8,{size:7,align:'center',color:'#ffd1e1'}); };
  return new Cutscene([ { dur:40, enter:()=>{ Fade.set(1); Fade.to(0,0.02); }, draw }, { draw, update:t=>{ if(t>BIRTHDAY_LINES.length*18+60 && CONFIRM()) { Fade.to(1,0.03,onDone); } } } ]);
};

</script>
<script>
'use strict';
// ===== Main: state machine, level loop, HUD, title =====
const G={ state:'title', frame:0, scene:null, rescued:[false,false,false], stage:0, level:null, player:null, cam:{x:0,y:0}, enemies:[], proj:[], pproj:[], pickups:[], boss:null, bossStarted:false, bossBanner:0, shake:0, cageBroken:false, cpIndex:0, titleT:0, ultFlash:0, deaths:0,
  ult(){ this.ultFlash=20; for(const e of this.enemies){ if(!e.dead && Math.abs(e.x-this.player.x)<W*0.7){ e.hurt(6); } } if(this.boss && !this.boss.dead) this.boss.hurt(6); for(const p of this.proj) Particles.burst(p.x,p.y,4,'#fff',1,10); this.proj.length=0; this.shake=12; Particles.hearts(this.player.x,this.player.y-20,16); }
};
function setState(s){ G.state=s; clearPressed(); }
function startIntro(){ setState('intro'); G.scene=Scenes.intro(()=>gotoMap()); }
function gotoMap(){ Particles.clear(); Dialog.top=false; G.boss=null; G.level=null; setState('map'); Fade.set(0); G.scene=Scenes.map(i=>{ G.stage=i; setState('card'); G.scene=Scenes.card(i,()=>startLevel(i)); }); }
function startLevel(i){ G.level=buildLevel(i); G.stage=i; G.cpIndex=0; G.bossStarted=false; G.boss=null; G.cageBroken=false; G.bossBanner=0; spawnAll(); G.player=new Player(G.level.checkpoints[0],(ROWS-3)*TILE); G.cam.x=0; G.levelT=0; setState('level'); Fade.set(1); Fade.to(0,0.03); AudioSys.play(THEMES[i].song); }
function spawnAll(){ G.enemies=G.level.spawns.map(s=>new Enemy(s,G.level.theme)); G.proj=[]; G.pproj=[]; G.pickups=G.level.pickups.map(p=>({x:p.x,y:p.y})); Particles.clear(); }
function respawn(){ const L=G.level; spawnAll(); const x=L.checkpoints[G.cpIndex]; G.player=new Player(x,L.surface?L.surface(Math.floor(x/TILE)):(ROWS-3)*TILE); G.player.y=(function(){ for(let y=0;y<ROWS;y++){ const v=L.get(Math.floor(x/TILE),y); if(v===1||v===2) return y*TILE; } return (ROWS-3)*TILE; })(); G.bossStarted=false; G.boss=null; G.bossBanner=0; AudioSys.play(THEMES[L.theme].song); Fade.set(1); Fade.to(0,0.04); }

// ---------------- LEVEL UPDATE ----------------
function updateLevel(){
  const L=G.level, pl=G.player; if(!pl) return;
  if(G.state==='rescue'){ G.scene.update(); pl.t++; if(G.boss) G.boss.update(pl); Particles.update(); return; }
  pl.locked = G.bossBanner>0; G.levelT++;
  pl.update(L);
  // hazards (spikes) + pit
  if(!pl.dead){ const r=pl.rect(); const tx0=Math.floor((r.x+2)/TILE), tx1=Math.floor((r.x+r.w-3)/TILE), ty0=Math.floor((r.y+4)/TILE), ty1=Math.floor((r.y+r.h-1)/TILE); outer: for(let tx=tx0;tx<=tx1;tx++) for(let ty=ty0;ty<=ty1;ty++) if(L.get(tx,ty)===3){ pl.hurt(2,pl.x+(pl.face)); break outer; }
    if(pl.y>H+30){ pl.hp=0; pl.die(); } }
  // boss trigger / arena clamp
  if(!G.bossStarted && pl.x>L.bossX+60){ G.bossStarted=true; G.boss=new BOSS_CLASSES[L.theme](L); G.bossBanner=110; AudioSys.play('boss'); AudioSys.sfx('alarm'); }
  if(G.bossStarted){ pl.x=clamp(pl.x,L.bossX+pl.w/2+2,L.bossX+W-pl.w/2-2); if(G.bossBanner>0) G.bossBanner--; }
  // checkpoints
  L.checkpoints.forEach((cx,i)=>{ if(i>G.cpIndex && pl.x>cx-6){ G.cpIndex=i; AudioSys.sfx('pickup'); Particles.hearts(cx+6,pl.y-20,6); } });
  // enemies
  updatePlayerShots(L,pl);
  for(const e of G.enemies){ if(e.dead) continue; if(Math.abs(e.x-pl.x)>W*0.8) continue; e.update(L,pl);
    if(!e.dead && !pl.dead && overlap(e.rect(),pl.rect())) pl.hurt(1,e.x); }
  G.enemies=G.enemies.filter(e=>!e.dead);
  // boss
  if(G.boss){ const b=G.boss; b.update(pl);
    if(!b.dead){ if(!pl.dead && b.alpha>0.5 && b.state!=='intro' && overlap(b.rect(),pl.rect())) pl.hurt(1,b.x); }
    else if(b.state==='dying' && b.st>=115 && G.state==='level'){ setState('rescue'); G.proj.length=0; G.pproj.length=0; Dialog.top=true; G.scene=Scenes.rescue(L.theme,pl,L,()=>{ G.rescued[L.theme]=true; if(G.rescued.every(Boolean)){ Dialog.top=false; setState('finale'); G.scene=Scenes.finale(()=>{ setState('birthday'); G.scene=Scenes.birthday(()=>{ G.rescued=[false,false,false]; setState('title'); Fade.set(1); Fade.to(0,0.02); AudioSys.play('title'); }); }); } else gotoMap(); }); } }
  updateProjectiles(L,pl); updatePickups(L,pl); Particles.update();
  // death → respawn
  if(pl.dead && pl.deathT===60){ Fade.to(1,0.04,()=>{ G.deaths++; respawn(); }); }
  // camera
  if(G.bossStarted) G.cam.x=L.bossX; else { const tx=clamp(pl.x-W/2+pl.face*24,0,L.w*TILE-W); G.cam.x=lerp(G.cam.x,tx,0.12); }
  if(G.shake>0) G.shake--; if(G.ultFlash>0) G.ultFlash--;
}
// ---------------- LEVEL DRAW ----------------
function drawLevel(){
  const L=G.level, pl=G.player, th=THEMES[L.theme];
  BG.draw(L.theme,G.cam.x,0);
  ctx.save(); const sx=G.shake>0?rand(-3,3):0, sy=G.shake>0?rand(-2,2):0; ctx.translate(Math.round(-G.cam.x+sx),Math.round(sy));
  drawDecos(L,G.cam.x); drawTiles(L,G.cam.x);
  L.checkpoints.forEach((cx,i)=>{ if(i===0) return; let y=(ROWS-3)*TILE; for(let r=0;r<ROWS;r++){ const v=L.get(Math.floor(cx/TILE),r); if(v===1||v===2){ y=r*TILE; break; } } drawCheckpoint(cx,y,i<=G.cpIndex,G.frame); });
  for(const p of G.pickups) drawHeartPickup(p.x,p.y,G.frame+p.x);
  // captive + cage
  if(G.state==='rescue') G.scene.drawNPC(G.frame); else { drawChar(th.captive,L.cageX,(ROWS-3)*TILE,{t:G.frame,face:-1}); drawCage(L.cageX,(ROWS-3)*TILE,G.frame,false); }
  for(const e of G.enemies) if(Math.abs(e.x-G.cam.x-W/2)<W) e.draw();
  if(G.boss) G.boss.draw();
  pl.draw();
  for(const p of G.proj) drawProjectile(p,G.frame); for(const p of G.pproj) drawHeartShot(p);
  Particles.draw();
  ctx.restore();
  if(G.ultFlash>0) RA(0,0,W,H,'#ffd1e1',G.ultFlash/40);
  drawHUD();
  if(G.bossBanner>0){ const a=G.bossBanner>90?(110-G.bossBanner)/20:G.bossBanner<20?G.bossBanner/20:1; ctx.globalAlpha=a; RA(0,100,W,50,'#000',0.6); R(0,100,W,1,'#ff1744'); R(0,149,W,1,'#ff1744'); text('WARNING',W/2,106,{size:9,align:'center',color:'#ff1744',font:FONT_EN,bold:true}); text(th.boss,W/2,120,{size:14,align:'center',color:'#fff',bold:true}); text(th.bossEn,W/2,138,{size:8,align:'center',color:'#ffd27f',font:FONT_EN}); ctx.globalAlpha=1; }
  if(G.state==='rescue') Dialog.draw();
}
function drawHUD(){ const pl=G.player; if(!pl) return; const th=THEMES[G.level.theme];
  RA(6,6,110,30,'#000',0.45); text('GISELLE',10,8,{size:7,color:'#ff9ec4',font:FONT_EN,bold:true});
  for(let i=0;i<pl.maxHp;i++) heartShape(16+i*12,22,4,i<pl.hp?'#ff4d79':'#3a2a35');
  R(10,32,100,3,'#222'); R(10,32,pl.energy,3,pl.energy>=100?(((G.frame>>3)&1)?'#fff':'#ff6b9d'):'#b388ff'); if(pl.energy>=100) text('D 心之波 READY!',52,20,{size:6,color:'#fff'});
  text('STAGE '+(G.stage+1)+'  '+th.name,W-8,8,{size:7,align:'right',color:'#ddd'});
  if(G.boss && !G.boss.dead && G.boss.state!=='intro'){ const b=G.boss; const bw=240,bx=(W-bw)/2,by=H-16; RA(bx-2,by-12,bw+4,16,'#000',0.5); text(th.boss,W/2,by-11,{size:7,align:'center',color:'#ffd27f'}); R(bx,by,bw,5,'#3a0a0a'); R(bx,by,bw*b.hp/b.maxHp,5,b.phase===2?'#ff6b35':'#e53935'); R(bx,by,bw*b.hp/b.maxHp,1,'#ff9e80'); }
  if(G.levelT<720 && G.stage===0 && !G.bossStarted){ ctx.globalAlpha=clamp((720-G.levelT)/60,0,1); RA(W/2-150,H-40,300,22,'#000',0.6); text('← → 移動   空白 跳躍(二段)   A 心形飛彈   S 瞬移   D 心之波   ↓+空白 下平台',W/2,H-34,{size:7,align:'center',color:'#fff'}); ctx.globalAlpha=1; }
}
// ---------------- TITLE ----------------
srand(99); const TSTARS=[]; for(let i=0;i<90;i++) TSTARS.push([rnd()*W,rnd()*H,rnd()]);
function drawTitle(){ const t=G.titleT++; const gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#07071f'); gr.addColorStop(1,'#2a0f3d'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  for(const s of TSTARS) R(s[0],s[1],1,1,((t/15+s[2]*10)|0)%4?'#fff':'#445');
  if(t%12===0) Particles.add({x:rand(0,W),y:H+4,vy:rand(-0.6,-0.2),vx:rand(-0.2,0.2),life:160,type:'heart',size:rand(1.5,4),color:['#ff6b9d','#ff9ec4','#b388ff'][t%3]}); Particles.update(); Particles.draw();
  // emblem
  const ex=W/2, ey=118; ctx.globalAlpha=0.18+Math.sin(t/30)*0.06; heartShape(ex,ey-40,70,'#ff6b9d'); ctx.globalAlpha=1;
  // big Giselle
  ctx.save(); ctx.translate(ex+150,232); ctx.scale(3,3); drawChar('giselle',0,0,{t,face:-1}); ctx.restore();
  ctx.save(); ctx.translate(ex-150,232); ctx.scale(2,2); drawChar('william',-24,0,{t,face:1,alpha:0.5}); drawChar('liam',-6,0,{t,face:1,alpha:0.5}); drawChar('rex',10,0,{t,face:1,alpha:0.5}); ctx.restore();
  text("GISELLE'S HEART",ex,56,{size:30,align:'center',color:'#ffe6f2',font:FONT_EN,bold:true,shadow:'#7a1f5a'}); text('— Eternal Reunion —',ex,96,{size:12,align:'center',color:'#ff9ec4',font:FONT_EN}); text('吉賽兒之心：永恆重逢',ex,116,{size:12,align:'center',color:'#fff',bold:true});
  if((t>>4)&1) text('PRESS SPACE',ex,170,{size:11,align:'center',color:'#fff',font:FONT_EN});
  text('方向鍵 移動　空白鍵 跳躍　A 攻擊　S 瞬移　D 心之波',ex,236,{size:8,align:'center',color:'#bbb'}); text('A gift for Giselle  ♥  2026.11.25',ex,254,{size:7,align:'center',color:'#777',font:FONT_EN});
}
// ---------------- LOOP ----------------
let last=0, acc=0; const STEP=1000/60;
function loop(ts){ requestAnimationFrame(loop); if(!last) last=ts; let dt=ts-last; last=ts; if(dt>100) dt=100; acc+=dt; let n=0; while(acc>=STEP && n<4){ update(); acc-=STEP; n++; clearPressed(); } draw(); }
function update(){ G.frame++;
  switch(G.state){
    case 'title': if(CONFIRM()){ AudioSys.sfx('select'); setState('fadeintro'); Fade.to(1,0.03,()=>startIntro()); } break;
    case 'fadeintro': break;
    case 'intro': case 'map': case 'card': case 'finale': case 'birthday': if(G.scene){ G.scene.update(); if(G.state==='intro'||G.state==='map'||G.state==='finale'||G.state==='birthday') Particles.update(); } break;
    case 'level': case 'rescue': updateLevel(); break;
  }
  Fade.update(); if(G.state==='title' && !AudioSys.ready) {} 
}
function draw(){ beginFrame(); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  switch(G.state){
    case 'title': case 'fadeintro': drawTitle(); break;
    case 'intro': case 'map': case 'card': case 'finale': case 'birthday': if(G.scene){ G.scene.draw(); if(G.state!=='card') Particles.draw(); if(Dialog.active && G.state!=='card') {} } break;
    case 'level': case 'rescue': drawLevel(); break;
  }
  Fade.draw();
  if(!AudioSys.ready && G.state==='title') text('♪ 按任意鍵開啟音效',W-8,H-12,{size:7,align:'right',color:'#888'});
}
window.addEventListener('keydown',e=>{ if(G.state==='title' && !AudioSys.ready){ setTimeout(()=>AudioSys.play('title'),50); } },{once:false});
AudioSys.init && null;
requestAnimationFrame(loop);

</script>
